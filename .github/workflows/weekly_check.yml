name: Weekly Check

on:
  schedule:
    - cron: '0 9 * * 1'  # 09:00 UTC every Monday
  workflow_dispatch:

jobs:
  weekly-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -c "from src.scheduler.jobs import weekly_job; weekly_job()"
        env:
          ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          T212_DEMO_API_KEY: ${{ secrets.T212_DEMO_API_KEY }}
          T212_DEMO_API_SECRET: ${{ secrets.T212_DEMO_API_SECRET }}
          T212_DEMO_BASE_URL: ${{ secrets.T212_DEMO_BASE_URL }}
