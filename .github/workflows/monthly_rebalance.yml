name: Monthly Rebalance

on:
  schedule:
    - cron: '0 9 * * *'  # 09:00 UTC daily (job checks internally if it's the first trading day)
  workflow_dispatch:

jobs:
  monthly-rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours — user has up to 5h to approve via Telegram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -c "from src.scheduler.jobs import monthly_job; monthly_job()"
        env:
          ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          T212_DEMO_API_KEY: ${{ secrets.T212_DEMO_API_KEY }}
          T212_DEMO_API_SECRET: ${{ secrets.T212_DEMO_API_SECRET }}
          T212_DEMO_BASE_URL: ${{ secrets.T212_DEMO_BASE_URL }}
